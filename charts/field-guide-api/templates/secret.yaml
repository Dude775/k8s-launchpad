# charts/field-guide-api/templates/secret.yaml
# Kubernetes Secret holding MONGO_URI — the ONLY place this credential appears in the chart.
# NEVER put MONGO_URI in the ConfigMap, Deployment env literal, image ENV, or NOTES.txt.
# URI shape (live-verified vs mongo:7 + PyMongo 4.13.2): RESEARCH.md Pattern 4 + Resolved Flag 1.
# Two non-negotiable properties:
#   1. ?authSource=admin  — root user lives in admin; omitting this causes AuthenticationFailed
#   2. DB name in URI path — Flask-PyMongo derives mongo.db from it; omitting it breaks entries routes
# Hostname comes from the shared field-guide-api.mongodb.fullname helper (RESEARCH.md Pitfall 9).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "field-guide-api.fullname" . }}
  labels:
    {{- include "field-guide-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.mongodb.enabled }}
  {{- /* urlquery percent-encodes URI-reserved characters (@ : / % ? #) in credentials —
         a raw "@" in the password would shift the parsed hostname; PyMongo raises InvalidURI
         on unencoded reserved characters (crash-loop at startup). */}}
  MONGO_URI: "mongodb://{{ .Values.mongodb.auth.username | urlquery }}:{{ .Values.mongodb.auth.password | urlquery }}@{{ include "field-guide-api.mongodb.fullname" . }}:27017/{{ .Values.mongodb.auth.database }}?authSource=admin"
  {{- else }}
  {{- /* PRD-3 seam: DB-less/external-DB apps disable the in-chart mongodb and bring their own URI. */}}
  MONGO_URI: {{ required "mongodb.enabled=false requires an external URI: --set externalMongoUri=mongodb://..." .Values.externalMongoUri | quote }}
  {{- end }}
