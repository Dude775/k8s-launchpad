{{- if .Values.mongodb.enabled }}
# charts/field-guide-api/templates/mongodb/service.yaml
# ClusterIP Service for MongoDB — reachable only inside the cluster (no NodePort/hostPort).
# metadata.name is derived from the SAME field-guide-api.mongodb.fullname helper used by
# the app Secret's MONGO_URI hostname — single source of truth (RESEARCH.md Pitfall 9).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "field-guide-api.mongodb.fullname" . }}
  labels:
    {{- include "field-guide-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app.kubernetes.io/name: {{ include "field-guide-api.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mongodb
{{- end }}
