# charts/launchpad/templates/service.yaml
# ClusterIP Service for the launchpad platform dashboard.
# Exposed only inside the cluster; access via kubectl port-forward (see NOTES.txt).
# NodePort excluded: requires kind extraPortMappings -> cluster re-create.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "launchpad.fullname" . }}
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "launchpad.selectorLabels" . | nindent 4 }}
