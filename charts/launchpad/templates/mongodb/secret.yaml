{{- if .Values.mongodb.enabled }}
# charts/launchpad/templates/mongodb/secret.yaml
# Kubernetes Secret for MongoDB root user credentials.
# The mongo:7 image entrypoint reads MONGO_INITDB_ROOT_* and creates the root user in
# the "admin" database on first init.
# stringData avoids error-prone manual base64 encoding (API server handles encoding).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "launchpad.mongodb.fullname" . }}
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.auth.username | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.auth.password | quote }}
{{- end }}
