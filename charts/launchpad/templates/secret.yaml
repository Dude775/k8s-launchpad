# charts/launchpad/templates/secret.yaml
# Kubernetes Secret holding MONGO_URI — the ONLY place this credential appears in the chart.
# NEVER put MONGO_URI in the ConfigMap, Deployment env literal, image ENV, or NOTES.txt.
# This is a LOCAL DEV PLACEHOLDER ONLY until Phase 9 (DEP-03) supplies real in-cluster
# MongoDB manifests for launchpad's own database — never a real credential.
# serverSelectionTimeoutMS=2000 bounds PyMongo's ping when Mongo is down (matches
# app/__init__.py MONGO_SERVER_SELECTION_TIMEOUT_MS default of 2000) so /health
# fails fast (503) instead of hanging past the readinessProbe timeoutSeconds.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "launchpad.fullname" . }}
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_URI: {{ .Values.mongoUri | quote }}
