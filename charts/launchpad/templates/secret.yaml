# charts/launchpad/templates/secret.yaml
# Kubernetes Secret holding MONGO_URI + SECRET_KEY — the ONLY place these credentials
# appear in the chart. NEVER put them in the ConfigMap, Deployment env literal, image
# ENV, or NOTES.txt.
# MONGO_URI/mongodb.auth.password are LOCAL DEV DEFAULTS ONLY (Phase 9, DEP-03 in-cluster
# MongoDB) — never a real credential; override with --set for anything real.
# serverSelectionTimeoutMS=2000 bounds PyMongo's ping when Mongo is down (matches
# app/__init__.py MONGO_SERVER_SELECTION_TIMEOUT_MS default of 2000) so /health
# fails fast (503) instead of hanging past the readinessProbe timeoutSeconds.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "launchpad.fullname" . }}
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_URI: {{ .Values.mongoUri | quote }}
  SECRET_KEY: {{ .Values.secretKey | quote }}
