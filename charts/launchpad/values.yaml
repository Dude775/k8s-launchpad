# charts/launchpad/values.yaml
# Generic values schema — mirrors the PRD-3 templating seam (HELM-04).
# LOCAL DEV DEFAULTS ONLY — override sensitive values with --set or -f for anything real.
# Discipline mirror: apps/launchpad/.env.example
# Mongo manifests embedded in this chart as of Phase 9 (DEP-03) — see the mongodb: block below.

replicaCount: 1

image:
  repository: localhost:5001/launchpad
  tag: latest
  # IfNotPresent is locked by HELM-04 — never change this default.
  # To pick up a rebuilt image with the same tag, use: kubectl rollout restart deploy/<name>
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

metrics:
  enabled: true  # PRD-4 scrape seam — enables Prometheus annotations on the pod template

config:
  # In-cluster DNS name for the field-guide API's ClusterIP Service (port 80).
  fieldGuideBaseUrl: http://field-guide-api
  # Surfaced in /api/status; overridden at build/release time when packaging metadata exists.
  appVersion: dev
  # empty = disabled; _env_flag in app/config.py treats empty string as False.
  # MUST stay empty (or unset) in containers and Kubernetes deployments.
  flaskDebug: ""
  # 7-day TTL for the events collection index (app/events.py); smoke overrides to a
  # short value to verify expiry.
  eventsTtlSeconds: "604800"

# Flask SECRET_KEY — local dev only, never a real credential; override with --set for anything real.
secretKey: "dev-secret-key-not-for-production"

# MongoDB in-cluster — plain mongo:7 manifests embedded in the chart (NOT Bitnami).
# Bitnami mongodb chart is behind Broadcom paywall since Sep 2025 — use these plain manifests.
# Mirrors charts/field-guide-api/values.yaml's mongodb: block shape (Phase 9, DEP-03).
mongodb:
  enabled: true
  image: mongo:7
  auth:
    username: root
    # local kind only; never a real credential — override with --set mongodb.auth.password=<real> for anything real.
    password: launchpad-dev-password
    database: launchpad
  persistence:
    enabled: true
    size: 1Gi
    # empty = cluster default ("standard" on kind, local-path provisioner, WaitForFirstConsumer).
    # PVC is chart-owned (Deployment-bound, NOT StatefulSet) so helm uninstall removes it cleanly.
    storageClass: ""

# MONGO_URI Secret — launchpad's OWN in-cluster MongoDB (db name "launchpad"), never the
# field-guide API's database. Targets the launchpad.mongodb.fullname Service (default release
# name "launchpad" -> "launchpad-mongodb"); if you install with a non-default release name,
# override this value with --set mongoUri=... to match the resulting Service hostname.
# root user + authSource=admin because the mongo:7 entrypoint creates MONGO_INITDB_ROOT_* in
# the admin database (see templates/mongodb/secret.yaml). serverSelectionTimeoutMS=2000 keeps
# /health failing fast instead of hanging past the readinessProbe timeoutSeconds.
mongoUri: "mongodb://root:launchpad-dev-password@launchpad-mongodb:27017/launchpad?authSource=admin&serverSelectionTimeoutMS=2000"
